name: Monitoraggio normativo
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Controlla feed ufficiali
        run: node scripts/check-normativa.mjs
      - name: Pubblica solo segnalazioni da verificare
        run: |
          if ! git diff --quiet -- data/normativa-status.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/normativa-status.json
            git commit -m 'Aggiorna segnalazioni normative da verificare'
            git push
          fi
